<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de Paciente</title>

    <link
        rel="stylesheet"
        href="../visual/style.css"
    >

</head>


<body>

    <main class="pagina-cadastro">

        <section class="cadastro-container">

            <header class="cabecalho-cadastro">

                <h1>
                    Cadastro de Paciente
                </h1>

                <p>
                    Sistema de Enfermagem
                </p>

            </header>


            <form
                id="formCadastro"
                novalidate
            >


                <!-- =====================================
                     IDENTIFICAÇÃO
                ====================================== -->

                <div class="secao-formulario">

                    <h2>
                        Identificação do paciente
                    </h2>


                    <div class="campo-formulario">

                        <label for="nomeCompleto">
                            Nome completo *
                        </label>

                        <input
                            type="text"
                            id="nomeCompleto"
                            name="nomeCompleto"
                            autocomplete="off"
                            required
                        >

                        <small
                            id="nomeCompleto-feedback"
                            class="feedback-campo"
                        ></small>

                    </div>


                    <div class="linha-formulario">

                        <div class="campo-formulario">

                            <label for="nomeMae">
                                Nome da mãe *
                            </label>

                            <input
                                type="text"
                                id="nomeMae"
                                name="nomeMae"
                                required
                            >

                            <small
                                id="nomeMae-feedback"
                                class="feedback-campo"
                            ></small>

                        </div>


                        <div class="campo-formulario">

                            <label for="nomePai">
                                Nome do pai
                            </label>

                            <input
                                type="text"
                                id="nomePai"
                                name="nomePai"
                            >

                            <small
                                id="nomePai-feedback"
                                class="feedback-campo"
                            ></small>

                        </div>

                    </div>


                    <div class="linha-formulario">

                        <div class="campo-formulario">

                            <label for="dataNascimento">
                                Data de nascimento *
                            </label>

                            <input
                                type="date"
                                id="dataNascimento"
                                name="dataNascimento"
                                required
                            >

                            <small
                                id="dataNascimento-feedback"
                                class="feedback-campo"
                            ></small>

                        </div>


                        <div class="campo-formulario">

                            <label for="cpf">
                                CPF fictício *
                            </label>

                            <input
                                type="text"
                                id="cpf"
                                name="cpf"
                                inputmode="numeric"
                                maxlength="14"
                                placeholder="000.000.000-00"
                                required
                            >

                            <small
                                id="cpf-feedback"
                                class="feedback-campo"
                            ></small>

                        </div>

                    </div>


                    <div class="linha-formulario">

                        <div class="campo-formulario">

                            <label for="rg">
                                RG
                            </label>

                            <input
                                type="text"
                                id="rg"
                                name="rg"
                            >

                        </div>


                        <div class="campo-formulario">

                            <label for="numeroProntuario">
                                Número do prontuário
                            </label>

                            <input
                                type="text"
                                id="numeroProntuario"
                                name="numeroProntuario"
                                value="Gerado automaticamente"
                                readonly
                            >

                        </div>

                    </div>

                </div>


                <!-- =====================================
                     CONTATO
                ====================================== -->

                <div class="secao-formulario">

                    <h2>
                        Contato
                    </h2>


                    <div class="linha-formulario">

                        <div class="campo-formulario">

                            <label for="telefone">
                                Telefone *
                            </label>

                            <input
                                type="text"
                                id="telefone"
                                name="telefone"
                                inputmode="numeric"
                                maxlength="15"
                                placeholder="(00) 00000-0000"
                                required
                            >

                            <small
                                id="telefone-feedback"
                                class="feedback-campo"
                            ></small>

                        </div>


                        <div class="campo-formulario">

                            <label for="email">
                                E-mail
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                            >

                            <small
                                id="email-feedback"
                                class="feedback-campo"
                            ></small>

                        </div>

                    </div>

                </div>


                <!-- =====================================
                     ENDEREÇO
                ====================================== -->

                <div class="secao-formulario">

                    <h2>
                        Endereço
                    </h2>


                    <div class="linha-formulario">

                        <div class="campo-formulario">

                            <label for="cep">
                                CEP *
                            </label>

                            <input
                                type="text"
                                id="cep"
                                name="cep"
                                inputmode="numeric"
                                maxlength="9"
                                placeholder="00000-000"
                                required
                            >

                            <small
                                id="cep-feedback"
                                class="feedback-campo"
                            ></small>

                        </div>


                        <div class="campo-formulario">

                            <label for="estado">
                                Estado *
                            </label>

                            <select
                                id="estado"
                                name="estado"
                                required
                            >

                                <option value="">
                                    Selecione
                                </option>

                                <option>AC</option>
                                <option>AL</option>
                                <option>AP</option>
                                <option>AM</option>
                                <option>BA</option>
                                <option>CE</option>
                                <option>DF</option>
                                <option>ES</option>
                                <option>GO</option>
                                <option>MA</option>
                                <option>MT</option>
                                <option>MS</option>
                                <option>MG</option>
                                <option>PA</option>
                                <option>PB</option>
                                <option>PR</option>
                                <option>PE</option>
                                <option>PI</option>
                                <option>RJ</option>
                                <option>RN</option>
                                <option>RS</option>
                                <option>RO</option>
                                <option>RR</option>
                                <option>SC</option>
                                <option>SP</option>
                                <option>SE</option>
                                <option>TO</option>

                            </select>

                        </div>

                    </div>


                    <div class="linha-formulario">

                        <div class="campo-formulario grande">

                            <label for="logradouro">
                                Logradouro *
                            </label>

                            <input
                                type="text"
                                id="logradouro"
                                name="logradouro"
                                placeholder="Rua, avenida..."
                                required
                            >

                        </div>


                        <div class="campo-formulario pequeno">

                            <label for="numero">
                                Número *
                            </label>

                            <input
                                type="text"
                                id="numero"
                                name="numero"
                                required
                            >

                        </div>

                    </div>


                    <div class="linha-formulario">

                        <div class="campo-formulario">

                            <label for="bairro">
                                Bairro *
                            </label>

                            <input
                                type="text"
                                id="bairro"
                                name="bairro"
                                required
                            >

                        </div>


                        <div class="campo-formulario">

                            <label for="cidade">
                                Cidade *
                            </label>

                            <input
                                type="text"
                                id="cidade"
                                name="cidade"
                                required
                            >

                        </div>

                    </div>


                    <div class="campo-formulario">

                        <label for="complemento">
                            Complemento
                        </label>

                        <input
                            type="text"
                            id="complemento"
                            name="complemento"
                            placeholder="Apartamento, bloco, casa..."
                        >

                    </div>

                </div>


                <!-- =====================================
                     CONTATO DE EMERGÊNCIA
                ====================================== -->

                <div class="secao-formulario">

                    <h2>
                        Contato de emergência
                    </h2>


                    <div class="linha-formulario">

                        <div class="campo-formulario">

                            <label for="nomeEmergencia">
                                Nome *
                            </label>

                            <input
                                type="text"
                                id="nomeEmergencia"
                                name="nomeEmergencia"
                                required
                            >

                        </div>


                        <div class="campo-formulario">

                            <label for="parentescoEmergencia">
                                Parentesco *
                            </label>

                            <input
                                type="text"
                                id="parentescoEmergencia"
                                name="parentescoEmergencia"
                                placeholder="Mãe, pai, irmão..."
                                required
                            >

                        </div>

                    </div>


                    <div class="campo-formulario">

                        <label for="telefoneEmergencia">
                            Telefone *
                        </label>

                        <input
                            type="text"
                            id="telefoneEmergencia"
                            name="telefoneEmergencia"
                            inputmode="numeric"
                            maxlength="15"
                            placeholder="(00) 00000-0000"
                            required
                        >

                    </div>

                </div>


                <!-- =====================================
                     FAMILIAR / RESPONSÁVEL
                ====================================== -->

                <div class="secao-formulario">

                    <h2>
                        Cadastro familiar
                    </h2>


                    <div class="linha-formulario">

                        <div class="campo-formulario">

                            <label for="responsavelFamiliar">
                                Familiar / responsável
                            </label>

                            <input
                                type="text"
                                id="responsavelFamiliar"
                                name="responsavelFamiliar"
                            >

                        </div>


                        <div class="campo-formulario">

                            <label for="parentescoFamiliar">
                                Parentesco
                            </label>

                            <input
                                type="text"
                                id="parentescoFamiliar"
                                name="parentescoFamiliar"
                            >

                        </div>

                    </div>

                </div>


                <!-- =====================================
                     CONVÊNIO
                ====================================== -->

                <div class="secao-formulario">

                    <h2>
                        Convênio
                    </h2>


                    <div class="linha-formulario">

                        <div class="campo-formulario">

                            <label for="convenio">
                                Convênio
                            </label>

                            <input
                                type="text"
                                id="convenio"
                                name="convenio"
                                placeholder="Particular, Unimed..."
                            >

                        </div>


                        <div class="campo-formulario">

                            <label for="numeroCarteirinha">
                                Número da carteirinha
                            </label>

                            <input
                                type="text"
                                id="numeroCarteirinha"
                                name="numeroCarteirinha"
                            >

                        </div>

                    </div>

                </div>


                <!-- =====================================
                     MENSAGEM
                ====================================== -->

                <div
                    id="mensagemCadastro"
                    class="mensagem"
                ></div>


                <!-- =====================================
                     BOTÃO
                ====================================== -->

                <div class="acoes-cadastro">

                    <button
                        type="submit"
                        class="btn-principal"
                    >
                        Cadastrar paciente
                    </button>

                    <a
                        href="prontuario.html"
                        class="btn-prontuario"
                    >
                        Ver prontuários dos pacientes
                    </a>

</div>


            </form>

        </section>

    </main>


    <script src="main.js"></script>

</body>

</html>
